# Example single-experiment config for a CLASSIFICATION metric.
# Run with:
#   python src/run_single.py --config src/cfg/examples/single_experiment_example_classif.yaml
#
# This file is self-contained on purpose (no Hydra `defaults:` composition) —
# fill in every field below and hand it to run_single.py.

# ---- What to run ----
task: "task_name_here"   # required: must match a "subtask" value in your data file
algo: null                # optional: a specific alg_name; leave null to run every
                           #   algorithm found for this task, and get an aggregated
                           #   coverage table across all of them

metric: "accuracy"        # one of: accuracy, npv, ppv, precision, recall, sensitivity,
                           # specificity, balanced_accuracy, f1_score, mcc, ap, auroc, auc
average: "macro"          # "macro" or "micro"

# ---- CI methods to evaluate ----
ci_methods: ["basic", "percentile", "bca", "agresti_coull", "wilson", "exact", "wald"]

# ---- KDE / resampling settings ----
kernel: "gaussian"          # gaussian, tophat, epanechnikov, exponential, cosine, linear
adaptive_bandwidth: true

sample_sizes: [10, 25, 50, 75, 100, 125, 150, 200, 250]
n_samples: 10000            # number of Monte-Carlo repeats per sample size
n_bootstrap: 9999           # number of bootstrap resamples (bootstrap CI methods only)

# ---- Data & output (relative to the repo root) ----
relative_data_path: "../data_matrix_classification.csv"
relative_output_dir: "../results_classif"